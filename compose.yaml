services:
  mimic:
    build:
      context: .
      dockerfile: Containerfile
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3210:3210'
      - '127.0.0.1:3211:3211'
      - '127.0.0.1:3215:3215'
    environment:
      ORIGIN: http://127.0.0.1:3210
    volumes:
      - mimic-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3212/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
volumes:
  mimic-data:
